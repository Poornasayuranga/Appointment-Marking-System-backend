spring.application.name=ams-backend

# ---- PostgreSQL ----
spring.datasource.url=jdbc:postgresql://localhost:5432/ams_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8080

# ---- JWT ----
# Change this secret before deploying anywhere real.
app.jwt.secret=ZmFrZS1kZXYtc2VjcmV0LWtleS1mb3ItYW1zLWJhY2tlbmQtY2hhbmdlLW1lLTEyMzQ1Ng==
app.jwt.expiration-ms=86400000

# ---- CORS ----
app.cors.allowed-origins=http://localhost:3000
